[package]
name = "platec"
version = "0.1.0"
edition = "2021"
license = "LGPL-2.1-or-later"
description = "Plate tectonics simulation, ported from the C++ plate-tectonics library"

[dependencies]

[features]
strict_asserts = []
# Restore bit-exact C++ behaviour, including the bugs the port deliberately
# reproduced. Off by default: the default build takes the fixes instead. The
# C++-baseline regression test only runs with this enabled.
classic_cpp = []
