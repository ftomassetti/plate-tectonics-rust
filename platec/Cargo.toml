[package]
name = "platec"
version = "0.1.0"
edition = "2021"
license = "LGPL-2.1-or-later"
description = "Plate tectonics simulation"

[dependencies]
rayon = { version = "1", optional = true }

[features]
default = ["parallel"]
strict_asserts = []
# Spread the per-plate work and the regeneration sweep across cores. Off for
# wasm, which has no threads by default.
parallel = ["dep:rayon"]
