<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>plate-tectonics — Rust/WASM demo</title>
<style>
  :root {
    --bg: #0f1216;
    --panel: #171c22;
    --panel-2: #1e252d;
    --line: #2b3540;
    --text: #dfe6ee;
    --muted: #8fa0b3;
    --accent: #4fa3ff;
    --accent-2: #35d1a1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 13px; }
  main {
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 18px;
    padding: 18px 20px 32px;
    align-items: start;
  }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px;
  }
  .panel h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
    margin: 0 0 10px;
    font-weight: 600;
  }
  .field { display: grid; grid-template-columns: 1fr 96px; gap: 8px; align-items: center; margin-bottom: 7px; }
  .field label { color: var(--muted); font-size: 13px; }
  input[type="number"], select {
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 6px;
    padding: 5px 7px;
    width: 100%;
    font: inherit;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  .buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  button {
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 7px;
    padding: 7px 12px;
    font: inherit;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #04121f; font-weight: 600; }
  button.primary:hover:not(:disabled) { filter: brightness(1.1); }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; margin-top: 4px; }
  .stat { background: var(--panel-2); border-radius: 7px; padding: 7px 9px; }
  .stat .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  .stat .v { font-size: 16px; font-variant-numeric: tabular-nums; }

  .viewer { display: flex; flex-direction: column; gap: 10px; }
  .canvas-wrap {
    background: #000;
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    line-height: 0;
    position: relative;
    display: flex;
    justify-content: center;
    /* Not `stretch`, which would pull the 2D map off its square aspect. */
    align-items: center;
  }
  /* `display: block` below would otherwise beat the UA rule for [hidden]. */
  canvas[hidden] { display: none; }
  canvas {
    display: block;
    image-rendering: pixelated;
    max-width: 100%;
    max-height: calc(100vh - 190px);
    width: auto;
    height: auto;
  }
  .toolbar { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .toolbar label { color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .status { color: var(--muted); font-size: 13px; min-height: 20px; }
  .status.error { color: #ff8080; }
  code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }
  /* The 3D view fills the viewer area and is smooth-scaled, unlike the
     pixel-exact 2D maps. */
  #canvas3d {
    image-rendering: auto;
    width: 100%;
    max-width: 100%;
    height: min(70vh, 620px);
    max-height: calc(100vh - 190px);
    cursor: grab;
    touch-action: none;
  }
  #canvas3d:active { cursor: grabbing; }
  #exagLabel input { width: 120px; }
  .hint { color: var(--muted); font-size: 12px; opacity: .75; }
</style>
</head>
<body>
<header>
  <h1>plate-tectonics</h1>
  <span class="sub">a plate tectonics simulation in Rust + WebAssembly</span>
</header>

<main>
  <div>
    <div class="panel">
      <h2>Configuration</h2>
      <div class="field"><label for="seed">Seed</label><input id="seed" type="number" value="12345" min="0"></div>
      <div class="field"><label for="width">Width</label><input id="width" type="number" value="512" min="5" max="2048"></div>
      <div class="field"><label for="height">Height</label><input id="height" type="number" value="512" min="5" max="2048"></div>
      <div class="field"><label for="seaLevel">Sea level</label><input id="seaLevel" type="number" value="0.65" step="0.01" min="0" max="1"></div>
      <div class="field"><label for="numPlates">Plates</label><input id="numPlates" type="number" value="10" min="1" max="100"></div>
      <div class="field"><label for="erosionPeriod">Erosion period</label><input id="erosionPeriod" type="number" value="60" min="0"></div>
      <div class="field"><label for="foldingRatio">Folding ratio</label><input id="foldingRatio" type="number" value="0.02" step="0.01" min="0" max="1"></div>
      <div class="field"><label for="aggrAbs">Aggr. overlap abs</label><input id="aggrAbs" type="number" value="1000000" min="0"></div>
      <div class="field"><label for="aggrRel">Aggr. overlap rel</label><input id="aggrRel" type="number" value="0.33" step="0.01" min="0" max="1"></div>
      <div class="field"><label for="cycleCount">Cycles</label><input id="cycleCount" type="number" value="2" min="0"></div>

      <div class="buttons">
        <button id="create" class="primary">Generate world</button>
        <button id="randomSeed">Random seed</button>
      </div>
    </div>

    <div class="panel" style="margin-top:14px">
      <h2>Simulation</h2>
      <div class="buttons" style="margin-top:0">
        <button id="run" disabled>Run</button>
        <button id="step" disabled>Step</button>
        <button id="step10" disabled>Step ×10</button>
      </div>
      <div class="field" style="margin-top:12px">
        <label for="stepsPerFrame">Steps / frame</label>
        <input id="stepsPerFrame" type="number" value="1" min="1" max="20">
      </div>
      <div class="stats">
        <div class="stat"><div class="k">Iteration</div><div class="v" id="statIter">–</div></div>
        <div class="stat"><div class="k">Cycle</div><div class="v" id="statCycle">–</div></div>
        <div class="stat"><div class="k">Plates</div><div class="v" id="statPlates">–</div></div>
        <div class="stat"><div class="k">Step time</div><div class="v" id="statMs">–</div></div>
      </div>
    </div>
  </div>

  <div class="viewer">
    <div class="toolbar">
      <label>View
        <select id="mode">
          <option value="terrain">Terrain</option>
          <option value="gray">Grayscale height</option>
          <option value="plates">Plate map</option>
          <option value="age">Crust age</option>
          <option value="terrain3d">Terrain (3D)</option>
        </select>
      </label>
      <label id="overlayLabel"><input type="checkbox" id="overlay"> Plate boundaries</label>
      <label id="arrowsLabel"><input type="checkbox" id="arrows"> Velocity arrows</label>
      <label id="exagLabel" hidden>Relief
        <input id="exag" type="range" min="0.005" max="0.12" step="0.005" value="0.022">
      </label>
      <label id="spinLabel" hidden><input type="checkbox" id="spin"> Auto-rotate</label>
      <label id="paletteLabel">Colours
        <select id="palette">
          <option value="natural">Natural</option>
          <option value="hypsometric">Hypsometric</option>
        </select>
      </label>
      <span id="hint3d" class="hint" hidden>drag to rotate · scroll to zoom</span>
    </div>
    <div class="canvas-wrap">
      <canvas id="canvas" width="512" height="512"></canvas>
      <canvas id="canvas3d" hidden></canvas>
    </div>
    <div class="status" id="status">Loading WebAssembly module…</div>
  </div>
</main>

<script type="module" src="./main.js"></script>
</body>
</html>
